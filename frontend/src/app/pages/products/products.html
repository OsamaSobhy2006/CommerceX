<div class="container my-5">
    <h1 class="text-center text-primary my-5">Product Page</h1>
    <div class="row">
        <div class="col-lg-3 mb-4">
            <app-sort (sortChanges)="onSortChange($event)"></app-sort>
            <app-search (searchChanged)="onSearchChange($event)"></app-search>
            <app-filter [selectedCategory]="selectedCategory" (categoryChanged)="onCategoryChange($event)"></app-filter>
        </div>
        <div class="col-lg-9">
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                @for(p of products; track p._id){
                    <app-card [product]="p" appHighlight>
                        <a [routerLink]="['/products', p?._id]" class="btn btn-primary mt-auto align-self-start">Show More</a>
                    </app-card>
                }
            </div>
            <div class="d-flex justify-content-center mt-5">
                <app-pagination [page]="page" [collectionSize]="collectionSize" (pageChange)="onPageChange($event)"></app-pagination>
            </div>
        </div>
    </div>
</div>
