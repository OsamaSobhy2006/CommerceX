<div class="container py-5">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Forget Password</h2>
                        <p class="text-muted mb-0">Enter your email to receive reset code</p>
                    </div>
            <form [formGroup]="forgetForm" (ngSubmit)="submitForm()">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control form-control-lg" placeholder="Enter your email"formControlName="email">
                    @if(email?.touched && email?.invalid){
                    <div class="mt-2 text-danger small">
                        @if(email?.getError('required')){
                            <span>Email is required</span>
                        }

                        @if(email?.getError('email')){
                            <span>Please enter a valid email</span>
                        }
                    </div>
                    }
                </div>
                <button class="btn btn-primary w-100 py-2" [disabled]="forgetForm.invalid">
                    <span>Send Reset Code</span>
                </button>
            </form>

            <div class="text-center mt-4">
            <a routerLink="/login" class="text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>

</div>

</div>
