<div class="filter-sidebar p-4">
    <h4 class="fw-bold mb-4 text-primary">Filters</h4>
    <div class="mb-5">
        <h5 class="fw-bold mb-4">Categories</h5>
        <div class="d-flex flex-column gap-3">
            <div class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    name="category"
                    value=""
                    [(ngModel)]="selectedCategory"
                    (change)="onCategoryChange()"
                >
                <label class="form-check-label">All Products</label>
            </div>
            <div class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    name="category"
                    value="clothes"
                    [(ngModel)]="selectedCategory"
                    (change)="onCategoryChange()"
                >
                <label class="form-check-label">Clothes</label>
            </div>
            <div class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    name="category"
                    value="electronics"
                    [(ngModel)]="selectedCategory"
                    (change)="onCategoryChange()"
                >
                <label class="form-check-label">Electronics</label>
            </div>
            <div class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    name="category"
                    value="sports"
                    [(ngModel)]="selectedCategory"
                    (change)="onCategoryChange()"
                >
                <label class="form-check-label">Sports</label>
            </div>
        </div>
    </div>
</div>
