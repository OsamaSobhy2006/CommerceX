<div class="col" [ngStyle] = "{
  width: productDetails ? '50%' : '100%',
  margin: productDetails ? '0 auto' : ''
}">
  <div class="card h-100" [ngClass]="{
    'd-flex': productDetails,
    'flex-row': productDetails,
    'justify-content-center': productDetails
  }">
    <img [src]="product?.image" [ngStyle]="{
      'width': productDetails ? '500px' : 'auto'
    }" class="card-img-top object-fit-cover" style="height: 300px" alt="..."/>
    <div class="card-body d-flex flex-column" [ngStyle]="{
      'width': productDetails ? '500px' : 'auto'
    }">
      <h5 class="card-title">{{ product?.name }}</h5>
      <span class="bg-success px-2 text-white rounded align-self-start">${{ product?.price }}</span>
      @if(productDetails){
        <p class="card-text">{{ product?.description }}</p>
      } @else{
        <p class="card-text"> {{ product?.description | truncate }}</p>
      }
      <ng-content></ng-content>
    </div>
  </div>
</div>
